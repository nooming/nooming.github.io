<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="404：页面不存在或已移动。">
    <title>404 · noomings</title><!-- 公共样式 -->
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/common.css">
    
    <style>
        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 20px;
            background-color: var(--color-canvas);
            background-image: var(--bg-canvas-grid);
            background-size: var(--bg-grid-size) var(--bg-grid-size);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-container {
            text-align: center;
            background: var(--color-card);
            border-radius: 0;
            padding: 60px 40px;
            border: 1px solid var(--line-hard);
            box-shadow: none;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--gradient-theme-title);
            background: none;
            -webkit-background-clip: unset;
            -webkit-text-fill-color: unset;
            background-clip: unset;
            margin-bottom: 20px;
            line-height: 1;
        }
        
        .error-title {
            font-size: 2rem;
            color: var(--gradient-theme-title);
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .error-message {
            font-size: 1.1rem;
            color: #5a6c7d;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        @media (max-width: 767.98px) {
            .error-container {
                padding: 40px 25px;
            }
            
            .error-code {
                font-size: 5rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .error-message {
                font-size: 1rem;
            }
            
            .error-actions {
                flex-direction: column;
            }
            
            .error-actions .back-btn {
                width: 100%;
                text-align: center;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">未找到页面</h1>
        <p class="error-message">
            链接可能已失效或地址有误。<br>
            可回主页继续浏览。
        </p>
        <div class="error-actions">
            <a href="/" class="back-btn">返回首页</a>
        </div>
    </div>
</body>
</html>
