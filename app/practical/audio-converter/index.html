<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="浏览器内转 MP3 / WAV。">
    <meta name="keywords" content="音频转换,格式转换,MP3,WAV,音频处理,在线工具">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../../../assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../assets/icons/favicon-16x16.png">
    <link rel="manifest" href="../../../assets/icons/site.webmanifest">
    <link rel="shortcut icon" href="../../../assets/icons/favicon.ico">
    
    <!-- 公共样式 -->
    <link rel="stylesheet" href="../../../assets/css/common.css">
    
    <title>音频转码</title>
    <style>
        .tool-content {
            margin-top: 0;
            font-size: 1.05rem;
        }
        .file-upload {
            margin: 20px 0;
            padding: 25px;
            border: 2px dashed #ecf0f1;
            border-radius: 0;
            text-align: center;
            transition: border-color 0.2s;
        }
        .file-upload:hover {
            border-color: var(--color-theme-deep);
        }
        .file-upload input {
            display: none;
        }
        .upload-btn {
            display: inline-block;
            padding: 10px 20px;
            background: var(--gradient-theme);
            color: var(--color-theme-ink);
            border-radius: 0;
            cursor: pointer;
            font-weight: 500;
        }
        .format-select {
            margin: 25px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .format-select select {
            padding: 10px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 0;
            font-size: 1rem;
            min-width: 150px;
        }
        .convert-btn {
            padding: 12px 25px;
            background: var(--gradient-theme);
            color: var(--color-theme-ink);
            border: none;
            border-radius: 0;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .convert-btn:hover {
            background: var(--gradient-theme-reverse);
        }
    </style>
</head>
<body class="page-container">
    <!-- 页面头部 -->
    <div class="page-header">
        <div class="header-top">
            <a href="../" class="back-btn">返回上一级</a>
            <a href="../../../index.html" class="back-btn">返回主页</a>
        </div>
        <div class="section-header section-header--page">
            <h1>音频格式转换器</h1>
            <p>本机转 MP3 / WAV，文件不上传。</p>
        </div>
    </div>
    <div class="converter">
        <div class="tool-content">
            <p>选一个音频，再选 MP3 或 WAV。浏览器能解码的才能转：WAV、MP3，以及 Chrome / Safari 下的 M4A / AAC。AMR、WMA 不行。</p>
            
            <div class="file-upload">
                <label for="audio-file" class="upload-btn">点击选择音频文件</label>
                <input type="file" id="audio-file" accept=".wav,.mp3,.m4a,.aac,.ogg,.flac,.webm,audio/wav,audio/mpeg,audio/mp4,audio/aac,audio/ogg,audio/flac,audio/webm" onchange="showFileName(this)">
                <p id="file-name" style="margin-top: 15px; color: #7f8c8d;">未选择文件</p>
            </div>

            <div class="format-select">
                <label for="target-format">目标转换格式：</label>
                <select id="target-format">
                    <option value="mp3">MP3（通用格式，体积小）</option>
                    <option value="wav">WAV（无损格式，音质好）</option>
                </select>
            </div>

            <button class="convert-btn" id="convert-btn">开始转换</button>
            <div id="result" style="margin-top: 20px;"></div>
        </div>
    </div>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 个人站点 · 非商用学习记录</p>
    </footer>

    <!-- lamejs 本地副本（须先于转换脚本）。CDN 在国内常加载失败，默认 MP3 就会转不了。 -->
    <script src="assets/js/vendor/lame.min.js"></script>
    <script src="../../../assets/js/utils.js"></script>
    <script src="assets/js/audio-converter.js"></script>
</body>
</html>
