<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="本地打开 .ipynb 预览 Markdown 与代码单元，不执行代码。">
    <title>读 ipynb · noomings</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../../../assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../../assets/icons/favicon-32x32.png">

<body class="page-container">
    <div class="page-header">
        <div class="header-top">
            <a href="../" class="back-btn">返回</a>
        </div>
        <div class="section-header section-header--page">
            <h1>读 ipynb</h1>
            <p>本地预览笔记本内容，不跑内核。</p>
        </div>
    </div>

    <main class="app-panel doc-panel">
        <p class="doc-hint">网页版只读。要在本机 Jupyter 里编辑运行，请用 <a href="../windows/">Windows 桌面版 nbopen</a>。</p>
        <div class="doc-upload">
            <label for="ipynb-file" class="doc-upload-btn">选择 .ipynb</label>
            <input type="file" id="ipynb-file" accept=".ipynb,application/json">
            <p id="file-name" class="doc-file-name">未选择文件</p>
        </div>
        <p id="status" class="doc-status" aria-live="polite">请选择笔记本</p>
        <div id="cells" class="ipynb-cells"></div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商业使用</p>
    </footer>
    <script src="../../../markdown/assets/js/vendor/marked.min.js"></script>
