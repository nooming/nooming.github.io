<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="五子棋：15×15 棋盘，双人对战与本地 AI，四档难度。">
    <meta name="keywords" content="五子棋,在线游戏,双人对战">
    <meta name="author" content="nooming">
    <title>五子棋 · noomings</title>
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <script src="/assets/js/shell-prefs-boot.js"></script>
    <link rel="stylesheet" href="../../../../../assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="../assets/css/board-game-chrome.css">
    <link rel="stylesheet" href="../assets/css/board-game-ui.css">
    <link rel="stylesheet" href="assets/css/gomoku.css">
    <link rel="stylesheet" href="../assets/css/board-game-shell.css">
</head>
<body class="page-container gomoku-root">
    <a class="skip-link" href="#main">跳到棋盘</a>

    <header class="page-header">
        <div class="section-header section-header--page">
            <h1>五子棋</h1>
            <p>双人或 AI · 四档难度 · 棋谱与提示</p>
        </div>
    </header>

    <main id="main" class="game-layout">
        <section class="board-panel" aria-labelledby="status">
            <div class="status-row">
                <span class="turn-dot" id="turnDot" data-player="1" aria-hidden="true"></span>
                <div class="status-text">
                    <h2 class="status" id="status" role="status" aria-live="polite">黑方先行</h2>
                    <p class="status-sub" id="statusSub">双人对战 · 黑棋先手</p>
                </div>
            </div>

            <div class="board-frame" id="boardFrame">
                <canvas id="board" width="600" height="600" tabindex="0" role="application"
                        aria-label="五子棋棋盘，方向键移动光标，回车或空格落子" aria-describedby="boardHelp">
                    你的浏览器不支持 canvas，请更换浏览器。
                </canvas>
            </div>

            <p class="board-help" id="boardHelp">
                点击交叉点落子。键盘：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动，<kbd>Enter</kbd> 落子，
                <kbd>U</kbd> 撤销，<kbd>H</kbd> 提示，<kbd>N</kbd> 新局。
            </p>
            <p class="sr-only" id="cursorAnnounce" aria-live="polite"></p>
        </section>

        <aside class="sidebar" aria-label="对局设置">
            <section class="panel" aria-labelledby="modeLabel">
                <h3 class="panel__title" id="modeLabel">对战模式</h3>
                <div class="segmented" role="group" aria-labelledby="modeLabel">
                    <button type="button" class="segmented__btn is-active" data-mode="two" aria-pressed="true">双人对战</button>
                    <button type="button" class="segmented__btn" data-mode="ai" aria-pressed="false">人机对战</button>
                </div>
            </section>

            <section class="panel" id="aiSettings" aria-labelledby="aiLabel" hidden>
                <h3 class="panel__title" id="aiLabel">人机设置</h3>

                <div class="field">
                    <span class="field__label" id="sideLabel">我方执子</span>
                    <div class="segmented segmented--sm" role="group" aria-labelledby="sideLabel">
                        <button type="button" class="segmented__btn is-active" data-side="black" aria-pressed="true">执黑先行</button>
                        <button type="button" class="segmented__btn" data-side="white" aria-pressed="false">执白后行</button>
                    </div>
                </div>

                <div class="field">
                    <span class="field__label" id="levelLabel">AI 难度</span>
                    <div class="segmented segmented--sm" role="group" aria-labelledby="levelLabel">
                        <button type="button" class="segmented__btn" data-level="easy" aria-pressed="false">简单</button>
                        <button type="button" class="segmented__btn" data-level="medium" aria-pressed="false">普通</button>
                        <button type="button" class="segmented__btn is-active" data-level="hard" aria-pressed="true">困难</button>
                        <button type="button" class="segmented__btn" data-level="master" aria-pressed="false">大师</button>
                    </div>
                </div>

                <p class="field__hint" id="levelHint">困难：8 层搜索，落子稳健。</p>
                <p class="ai-meta" id="aiMeta" hidden></p>
            </section>

            <section class="panel" aria-labelledby="actionLabel">
                <h3 class="panel__title" id="actionLabel">操作</h3>
                <div class="action-grid">
                    <button type="button" class="btn" id="undoBtn" aria-keyshortcuts="U" disabled>撤销 <kbd>U</kbd></button>
                    <button type="button" class="btn" id="redoBtn" aria-keyshortcuts="Y" disabled>重做 <kbd>Y</kbd></button>
                    <button type="button" class="btn" id="hintBtn" aria-keyshortcuts="H">提示 <kbd>H</kbd></button>
                    <button type="button" class="btn" id="lastBtn" aria-keyshortcuts="L">下哪了 <kbd>L</kbd></button>
                    <button type="button" class="btn btn-primary" id="newBtn" aria-keyshortcuts="N">新开一局 <kbd>N</kbd></button>
                </div>
            </section>

            <section class="panel" aria-labelledby="movesLabel">
                <div class="panel__head">
                    <h3 class="panel__title" id="movesLabel">棋谱</h3>
                    <span class="badge" id="moveCount">0 手</span>
                </div>
                <ol class="move-list" id="moveList" aria-label="已落子顺序"></ol>
                <p class="move-empty" id="moveEmpty">还没有落子。</p>
                <button type="button" class="btn btn--ghost btn--block" id="copyBtn" disabled>复制棋谱</button>
            </section>

            <section class="panel panel--stats" aria-labelledby="statsLabel">
                <h3 class="panel__title" id="statsLabel">统计</h3>
                <dl class="stats">
                    <div><dt>手数</dt><dd id="statMoves">0</dd></div>
                    <div><dt>黑棋</dt><dd id="statBlack">0</dd></div>
                    <div><dt>白棋</dt><dd id="statWhite">0</dd></div>
                </dl>
            </section>

            <p class="reset-note" id="resetNote">进度会自动保存在本机浏览器。</p>
        </aside>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
        <p class="noscript">本游戏需要启用 JavaScript 才能运行。</p>
    </noscript>

    <script src="assets/js/engine.js" defer></script>
    <script src="../../../../../assets/js/utils.js" defer></script>
    <script src="/assets/js/shell-preferences.js" defer></script>
    <script src="assets/js/game.js" defer></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
