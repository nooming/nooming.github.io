<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFA00" id="theme-color-meta">
<title>星铎棋 · noomings</title>
<meta name="description" content="星铎棋 · 六角翻转 · 双人或 AI · 四档难度 · 自定义残局。">
<meta name="keywords" content="星铎棋,六角翻转棋,翻转棋,人机对战">
<meta name="author" content="nooming">
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/assets/icons/site.webmanifest">
    <script src="/assets/js/shell-prefs-boot.js"></script>
    <link rel="stylesheet" href="../../../../../assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="../assets/css/board-game-chrome.css">
    <link rel="stylesheet" href="assets/css/star-duo.css">
    <link rel="stylesheet" href="assets/css/star-duo-noomings.css">
</head>

<body class="page-container star-duo-root">

<header class="page-header star-duo-chrome" id="xd-chrome-head">
  <div class="section-header section-header--page">
    <h1>星铎棋</h1>
    <p id="xd-page-sub">六角翻转 · 双人或 AI · 四档难度</p>
  </div>
</header>

<div class="app xd-app" id="xd-app" role="main" aria-label="星铎棋">

  <div id="screen-select" class="screen active xd-menu-screen" role="region" aria-label="主菜单">
    <div class="xd-menu-shell">
      <section class="panel panel--xd-home" aria-label="对战模式">
        <div class="panel__head panel__head--menu">
          <span class="sr-only" id="xd-menu-label">开始游戏</span>
          <div class="xd-menu-meta">
            <button type="button" class="btn btn--sm btn--ghost" onclick="showRules()" aria-haspopup="dialog">规则</button>
            <button type="button" class="btn btn--sm btn--ghost" onclick="showSettings()" aria-haspopup="dialog">设置</button>
          </div>
        </div>
        <p class="panel__subtitle">本地双人 · 人机</p>
        <div class="menu-btns" role="group" aria-labelledby="xd-menu-label">
          <button type="button" class="btn btn-primary" onclick="startLocalPVP()">双人对战</button>
          <button type="button" class="btn btn-primary" onclick="startPVE()" aria-haspopup="dialog">人机对战</button>
        </div>
        <button type="button" class="btn btn--block btn--ghost" onclick="openCustomEditor()">自定义模式</button>
      </section>
    </div>
  </div>

  <div id="screen-first" class="screen xd-menu-screen" role="region" aria-labelledby="first-title">
    <div class="xd-menu-shell">
      <section class="panel">
        <div class="panel__head">
          <button type="button" class="btn btn--sm btn--ghost" onclick="goSelect()">返回</button>
          <h3 class="panel__title" id="first-title">选择先手</h3>
        </div>
        <div id="first-btns" class="segmented" role="group" aria-labelledby="first-title"></div>
      </section>
    </div>
  </div>

  <div id="screen-difficulty" class="screen xd-menu-screen" role="region" aria-labelledby="diff-title">
    <div class="xd-menu-shell">
      <section class="panel">
        <div class="panel__head">
          <button type="button" class="btn btn--sm btn--ghost" onclick="backFromDifficulty()">返回</button>
          <h3 class="panel__title" id="diff-title">选择难度</h3>
        </div>
        <div id="diff-btns" class="xd-diff-list"></div>
      </section>
    </div>
  </div>

  <div id="screen-game" class="screen" role="region" aria-label="对局">
    <div class="stage" id="xd-stage">
      <div class="disc" aria-hidden="true"></div>
      <div class="boardwrap" id="boardwrap">
        <svg class="boardart" viewBox="0 0 880 780" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" role="presentation">
          <defs>
            <linearGradient id="v14wood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cdbd9c"/><stop offset="45%" stop-color="#a99a7d"/>
              <stop offset="100%" stop-color="#877a62"/>
            </linearGradient>
            <radialGradient id="v14base" cx="50%" cy="42%" r="72%">
              <stop offset="0" stop-color="#332a1a"/><stop offset="100%" stop-color="#120e08"/>
            </radialGradient>
            <filter id="v14blurA" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="14"/>
            </filter>
            <filter id="v14blurB" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6"/>
            </filter>
          </defs>
          <polygon points="787.8,390.0 613.9,691.2 266.1,691.2 92.2,390.0 266.1,88.8 613.9,88.8" fill="rgba(0,0,0,.55)" filter="url(#v14blurA)"/>
          <polygon points="777.8,390.0 608.9,682.5 271.1,682.5 102.2,390.0 271.1,97.5 608.9,97.5" fill="url(#v14wood)"/>
          <polygon points="777.8,390.0 608.9,682.5 271.1,682.5 102.2,390.0 271.1,97.5 608.9,97.5" fill="none" stroke="rgba(255,244,214,.35)" stroke-width="2"/>
          <polygon points="769.8,390.0 604.9,675.6 275.1,675.6 110.2,390.0 275.1,104.4 604.9,104.4" fill="none" stroke="rgba(70,52,28,.45)" stroke-width="3"/>
          <polygon points="745.8,390.0 592.9,654.8 287.1,654.8 134.2,390.0 287.1,125.2 592.9,125.2" fill="none" stroke="rgba(255,240,205,.18)" stroke-width="2"/>
          <polygon points="738.8,390.0 589.4,648.8 290.6,648.8 141.2,390.0 290.6,131.2 589.4,131.2" fill="url(#v14base)"/>
          <polygon points="738.8,390.0 589.4,648.8 290.6,648.8 141.2,390.0 290.6,131.2 589.4,131.2" fill="none" stroke="rgba(0,0,0,.65)" stroke-width="3"/>
          <polygon points="729.8,390.0 584.9,641.0 295.1,641.0 150.2,390.0 295.1,139.0 584.9,139.0" fill="none" stroke="rgba(64,124,255,.5)" stroke-width="12" filter="url(#v14blurB)"/>
        </svg>
        <div class="board gameboard" id="board" role="group" aria-label="54 格三角棋盘"></div>
        <svg class="boardglow" viewBox="0 0 880 780" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" role="presentation">
          <defs>
            <filter id="v14blurG" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
          </defs>
          <polygon points="729.8,390.0 584.9,641.0 295.1,641.0 150.2,390.0 295.1,139.0 584.9,139.0" fill="none" stroke="rgba(78,142,255,.75)" stroke-width="5" filter="url(#v14blurG)"/>
          <polygon points="729.8,390.0 584.9,641.0 295.1,641.0 150.2,390.0 295.1,139.0 584.9,139.0" fill="none" stroke="rgba(170,210,255,.5)" stroke-width="1.4"/>
        </svg>
      </div>
      <button type="button" class="closebtn" onclick="confirmReturn()" title="返回" aria-label="返回主菜单">&#215;</button>
      <div class="pile" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="beam beam-l" aria-hidden="true"></div>
      <div class="beam beam-r" aria-hidden="true"></div>
      <div class="side side-l">
        <div class="arrow" aria-hidden="true"></div>
        <div class="avatar av-blue" aria-hidden="true">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs><radialGradient id="avb" cx="50%" cy="34%" r="78%">
              <stop offset="0" stop-color="#333a46"/><stop offset="1" stop-color="#08090d"/>
            </radialGradient></defs>
            <rect width="100" height="100" fill="url(#avb)"/>
            <path d="M50 15c-15 0-25 10-25 24 0 7 2 12 4 16-1 3-2 6-2 9 2-6 6-9 6-9 2 6 5 10 9 12h16c4-2 7-6 9-12 0 0 4 3 6 9 0-3-1-6-2-9 2-4 4-9 4-16 0-14-10-24-25-24z" fill="#111a2c"/>
            <path d="M13 100c3-19 17-28 37-28s34 9 37 28z" fill="#0c1220"/>
            <ellipse cx="50" cy="45" rx="15" ry="18" fill="#f2dccb"/>
            <path d="M35 41c1-11 7-18 15-18s14 7 15 18c-4-7-9-11-15-11s-11 4-15 11z" fill="#0d1322"/>
            <path d="M25 98c3-17 14-26 25-26s22 9 25 26z" fill="#1d3a68"/>
            <path d="M43 48h4M53 48h4" stroke="#3a2b22" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="tally"><span class="sr-only">蓝方棋子</span><span class="num" id="cnt-blue">0</span><span class="pic" aria-hidden="true">
          <svg viewBox="0 0 24 22" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <path d="M12 3 L21 19 L3 19 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M5.4 15 H18.6" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </span></div>
      </div>
      <div class="side side-r">
        <div class="tally"><span class="pic white" aria-hidden="true">
          <svg viewBox="0 0 24 22" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <path d="M12 3 L21 19 L3 19 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M5.4 15 H18.6" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </span><span class="num" id="cnt-white">0</span><span class="sr-only">白方棋子</span></div>
        <div class="avatar av-white" aria-hidden="true">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs><radialGradient id="avw" cx="50%" cy="34%" r="78%">
              <stop offset="0" stop-color="#fdfaf2"/><stop offset="1" stop-color="#cec6b3"/>
            </radialGradient></defs>
            <rect width="100" height="100" fill="url(#avw)"/>
            <path d="M13 100c3-19 17-28 37-28s34 9 37 28z" fill="#5c5648"/>
            <path d="M50 15c-15 0-25 10-25 24 0 7 2 12 4 16-1 3-2 6-2 9 2-6 6-9 6-9 2 6 5 10 9 12h16c4-2 7-6 9-12 0 0 4 3 6 9 0-3-1-6-2-9 2-4 4-9 4-16 0-14-10-24-25-24z" fill="#e7e1d2"/>
            <ellipse cx="50" cy="45" rx="15" ry="18" fill="#f7e4d4"/>
            <path d="M35 41c1-11 7-18 15-18s14 7 15 18c-4-7-9-11-15-11s-11 4-15 11z" fill="#ddd5c3"/>
            <path d="M25 98c3-17 14-26 25-26s22 9 25 26z" fill="#b9b0a0"/>
            <path d="M43 48h4M53 48h4" stroke="#6b5d4c" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="arrow" aria-hidden="true"></div>
      </div>
      <div class="turnbar bar-l" id="status-line">等待开始...</div>
      <div class="result" id="result-banner" role="alert"></div>
      <div class="sr-only" id="a11y-live" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="tools">
        <button type="button" class="tbtn" id="timer-btn" onclick="toggleTimer()" aria-haspopup="dialog" title="计时设置（每步限时，超时判负）">计时 · 关</button>
        <button type="button" class="tbtn" id="reset-btn" onclick="resetBoard()">新局</button>
      </div>
      <div class="mhint" id="xd-move-hint"><i aria-hidden="true"></i>蓝 = 可落子 · 红边 = AI 刚下的位置</div>
      <div class="legend" id="score-line">黑 0 平 0 白 0</div>
    </div>
  </div>

  <div id="editor-panel" class="editor-panel" role="region" aria-label="自定义棋盘编辑器">
    <div class="editor-toolbar">
      <button type="button" class="ed-btn" id="ed-black" onclick="setEditMode(1)" aria-pressed="true">黑子</button>
      <button type="button" class="ed-btn" id="ed-white" onclick="setEditMode(2)" aria-pressed="false">白子</button>
      <button type="button" class="ed-btn" id="ed-erase" onclick="setEditMode(0)" aria-pressed="false">橡皮</button>
      <button type="button" class="ed-btn" onclick="editorClear()">清空</button>
      <button type="button" class="ed-btn green" onclick="editorStartGame()" aria-haspopup="dialog">开始游戏</button>
      <button type="button" class="ed-btn" id="ed-toggle-preset" onclick="toggleEditorPreset()" aria-expanded="false" aria-controls="editor-side">预设</button>
      <button type="button" class="ed-btn" onclick="saveCustomPreset()" aria-haspopup="dialog">保存预设</button>
      <button type="button" class="ed-btn" onclick="goSelect()">返回</button>
    </div>
    <div class="editor-body">
      <div class="disc" aria-hidden="true"></div>
      <div class="editor-board-wrap">
        <div class="editor-stage" id="editor-stage">
          <svg class="editor-boardart" viewBox="0 0 880 780" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" role="presentation">
            <defs>
              <linearGradient id="e-wood" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#cdbd9c"/><stop offset="45%" stop-color="#a99a7d"/>
                <stop offset="100%" stop-color="#877a62"/>
              </linearGradient>
              <radialGradient id="e-base" cx="50%" cy="42%" r="72%">
                <stop offset="0" stop-color="#332a1a"/><stop offset="100%" stop-color="#120e08"/>
              </radialGradient>
              <filter id="e-blurA" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="14"/>
              </filter>
              <filter id="e-blurB" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6"/>
              </filter>
            </defs>
            <polygon points="787.8,390.0 613.9,691.2 266.1,691.2 92.2,390.0 266.1,88.8 613.9,88.8" fill="rgba(0,0,0,.55)" filter="url(#e-blurA)"/>
            <polygon points="777.8,390.0 608.9,682.5 271.1,682.5 102.2,390.0 271.1,97.5 608.9,97.5" fill="url(#e-wood)"/>
            <polygon points="777.8,390.0 608.9,682.5 271.1,682.5 102.2,390.0 271.1,97.5 608.9,97.5" fill="none" stroke="rgba(255,244,214,.35)" stroke-width="2"/>
            <polygon points="769.8,390.0 604.9,675.6 275.1,675.6 110.2,390.0 275.1,104.4 604.9,104.4" fill="none" stroke="rgba(70,52,28,.45)" stroke-width="3"/>
            <polygon points="745.8,390.0 592.9,654.8 287.1,654.8 134.2,390.0 287.1,125.2 592.9,125.2" fill="none" stroke="rgba(255,240,205,.18)" stroke-width="2"/>
            <polygon points="738.8,390.0 589.4,648.8 290.6,648.8 141.2,390.0 290.6,131.2 589.4,131.2" fill="url(#e-base)"/>
            <polygon points="738.8,390.0 589.4,648.8 290.6,648.8 141.2,390.0 290.6,131.2 589.4,131.2" fill="none" stroke="rgba(0,0,0,.65)" stroke-width="3"/>
            <polygon points="729.8,390.0 584.9,641.0 295.1,641.0 150.2,390.0 295.1,139.0 584.9,139.0" fill="none" stroke="rgba(64,124,255,.5)" stroke-width="12" filter="url(#e-blurB)"/>
          </svg>
          <div class="editor-board gameboard" id="editor-board" role="group" aria-label="54 格三角棋盘编辑器"></div>
        </div>
      </div>
      <div class="editor-side" id="editor-side">
        <div class="editor-side-title" id="editor-side-title">预设</div>
        <div id="editor-preset-list" role="group" aria-labelledby="editor-side-title"></div>
      </div>
    </div>
  </div>

</div>

<footer class="site-footer star-duo-chrome" id="xd-chrome-foot" role="contentinfo">
  <p>© 2026 noomings · 非商用</p>
</footer>

<div id="overlay" class="overlay">
  <div class="modal" id="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</div>

<noscript>
  <p class="noscript-note">星铎棋需要启用 JavaScript 才能游玩，请在浏览器设置中允许脚本后刷新页面。</p>
</noscript>

<script src="assets/js/star-duo.js" defer></script>
