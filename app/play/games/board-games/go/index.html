<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="围棋：9/13/19 路，双人或三级 AI，悔棋、弃权、终局点目与 SGF 导出。">
    <meta name="keywords" content="围棋,在线围棋,人机对战,双人对弈,棋谱">
    <meta name="author" content="nooming">
    <title>围棋 · noomings</title>
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <script src="/assets/js/shell-prefs-boot.js"></script>
    <link rel="stylesheet" href="../../../../../assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="../assets/css/board-game-chrome.css">
    <link rel="stylesheet" href="../assets/css/board-game-ui.css">
    <link rel="stylesheet" href="assets/css/go-board.css">
    <link rel="stylesheet" href="../assets/css/board-game-shell.css">
    <script src="assets/js/go-engine.js" defer></script>
    <script src="assets/js/go-app.js" defer></script>
</head>
<body class="page-container go-root">
    <a class="skip-link" href="#main">跳到棋盘</a>

    <header class="page-header">
        <div class="section-header section-header--page">
            <h1>围棋</h1>
            <p>9 / 13 / 19 路 · 点目 · SGF 导出</p>
        </div>
    </header>

    <main id="main" class="game-layout">
        <section class="board-panel" aria-labelledby="statusText">
            <div class="status-row">
                <span class="turn-dot" id="turnDot" aria-hidden="true"></span>
                <div class="status-text">
                    <h2 class="status" id="statusText" role="status" aria-live="polite">黑方行棋</h2>
                    <p class="status-sub">第 <strong id="moveCount">0</strong> 手</p>
                </div>
            </div>
            <p class="hint" id="hint" role="status" aria-live="polite"></p>

            <div class="board-frame" id="boardFrame">
                <canvas id="board" width="560" height="560" role="application"
                    aria-label="围棋棋盘。点击交叉点落子。"
                    aria-describedby="boardNote"></canvas>
            </div>
            <p class="board-help board-note" id="boardNote">点击交叉点落子</p>
        </section>

        <aside class="sidebar" aria-label="对局设置">
            <section class="panel" aria-labelledby="modeLabel">
                <h3 class="panel__title" id="modeLabel">对战模式</h3>
                <div class="segmented" id="modeGroup" role="group" aria-labelledby="modeLabel">
                    <button type="button" class="seg" data-mode="two" aria-pressed="true">双人对战</button>
                    <button type="button" class="seg" data-mode="ai" aria-pressed="false">人机对战</button>
                </div>
            </section>

            <section class="panel" aria-labelledby="sizeLabel">
                <h3 class="panel__title" id="sizeLabel">棋盘路数</h3>
                <div class="segmented" id="sizeGroup" role="group" aria-labelledby="sizeLabel">
                    <button type="button" class="seg" data-size="9" aria-pressed="false">9 路</button>
                    <button type="button" class="seg" data-size="13" aria-pressed="false">13 路</button>
                    <button type="button" class="seg" data-size="19" aria-pressed="true">19 路</button>
                </div>
            </section>

            <section class="panel" id="difficultyRow" aria-labelledby="aiLabel" hidden>
                <h3 class="panel__title" id="aiLabel">人机设置</h3>
                <div class="field">
                    <span class="field__label" id="colorLabel">我方执子</span>
                    <div class="segmented segmented--sm" id="colorGroup" role="group" aria-labelledby="colorLabel">
                        <button type="button" class="seg" data-color="black" aria-pressed="true">执黑</button>
                        <button type="button" class="seg" data-color="white" aria-pressed="false">执白</button>
                    </div>
                </div>
                <div class="field">
                    <span class="field__label" id="difficultyLabel">AI 难度</span>
                    <div class="segmented segmented--sm" id="difficultyGroup" role="group" aria-labelledby="difficultyLabel">
                        <button type="button" class="seg" data-difficulty="easy" aria-pressed="false">简单</button>
                        <button type="button" class="seg" data-difficulty="medium" aria-pressed="true">中等</button>
                        <button type="button" class="seg" data-difficulty="hard" aria-pressed="false">困难</button>
                    </div>
                </div>
            </section>

            <section class="panel panel--stats" aria-labelledby="statsLabel">
                <h3 class="panel__title" id="statsLabel">局面</h3>
                <dl class="stats stats--go">
                    <div>
                        <dt>黑方提子</dt>
                        <dd id="blackCaptures">0</dd>
                    </div>
                    <div>
                        <dt>白方提子</dt>
                        <dd id="whiteCaptures">0</dd>
                    </div>
                    <div>
                        <dt>贴目</dt>
                        <dd id="komiValue">7.5</dd>
                    </div>
                    <div>
                        <dt>计分</dt>
                        <dd class="stats-note">中国规则</dd>
                    </div>
                </dl>
            </section>

            <section class="panel" aria-labelledby="actionLabel">
                <h3 class="panel__title" id="actionLabel">操作</h3>
                <div class="action-grid" role="group" aria-label="对局操作">
                    <button type="button" class="btn" id="undoBtn" disabled>悔棋</button>
                    <button type="button" class="btn" id="passBtn">弃权</button>
                    <button type="button" class="btn btn--danger" id="resignBtn">认输</button>
                    <button type="button" class="btn" id="whereBtn" disabled>下哪了</button>
                    <button type="button" class="btn" id="exportBtn" disabled>导出棋谱</button>
                    <button type="button" class="btn btn-primary" id="newBtn">新局</button>
                </div>
            </section>
        </aside>
    </main>

    <dialog class="result-dialog" id="resultDialog" aria-labelledby="resultTitle" aria-describedby="resultDetail">
        <div class="dialog-inner">
            <p class="dialog-kicker" id="resultKicker">终局</p>
            <h2 id="resultTitle">对局结束</h2>
            <p class="dialog-detail" id="resultDetail"></p>
            <div class="dialog-actions">
                <button type="button" class="btn" id="resultContinue">继续对局</button>
                <button type="button" class="btn btn-primary" id="resultNew">再来一局</button>
            </div>
        </div>
    </dialog>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
        <p class="noscript">本页需要启用 JavaScript 才能落子与运行 AI。</p>
    </noscript>

    <script src="../../../../../assets/js/utils.js" defer></script>
    <script src="/assets/js/shell-preferences.js" defer></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
