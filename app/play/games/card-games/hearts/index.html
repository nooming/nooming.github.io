<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#FFFA00">

        <title>红心大战 · noomings</title>
        <meta name="description" content="红心大战 · 本地人机 · 含规则教程。">
        <link rel="canonical" href="https://noomings.com/app/play/games/card-games/hearts/">
        <meta property="og:type" content="website">
        <meta property="og:title" content="红心大战 · noomings">
        <meta property="og:description" content="红心大战 · 本地人机 · 含规则教程。">
        <meta property="og:url" content="https://noomings.com/app/play/games/card-games/hearts/"><link rel="stylesheet" href="../../../../../assets/css/common.css">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
        <link rel="stylesheet" href="../assets/card-ui.css">
        <link rel="stylesheet" href="../assets/game-layout.css">
        <script src="../assets/card-game-scale.js" defer></script>

        <script src="../../../../../assets/js/utils.js"></script>
        <script src="../assets/common/card-game-copy.js"></script>
        <script src="../assets/common/card-table-surface.js"></script>
        <script src="../assets/common/dom.js"></script>
        <script src="../assets/common/card-game-actions.js"></script>
        <script src="../assets/common/ui-buttons.js"></script>
        <link rel="stylesheet" href="../assets/card-game-interaction.css">
        <script src="../assets/common/card-table-buttons.js"></script>
        <script src="../assets/common/tutorial-shell.js"></script>
        <script src="../assets/tutor-hearts.js"></script>
        <script src="../assets/hearts.js" defer></script>

        <style>
            .card-face {
                cursor: pointer;
                transition: transform 0.18s ease;
                transform-box: fill-box;
                transform-origin: center;
            }

            .card-face[data-selected="true"] {
                transform: translate3d(0, -12px, 0) scale(1.02);
            }

            .card-face[data-disabled="true"] {
                cursor: not-allowed;
            }

            .card-face.card-back {
                cursor: default;
            }

            .hearts-btns .btn {
                margin: 0 4px 6px;
            }

            .person-ready {
                fill: #d9534f;
                font-weight: 600;
            }

            .person-unready {
                transition: opacity 0.2s ease;
            }

        </style>
    </head>

    <body class="page-container card-game-page">
        <div class="page-header">
            <div class="section-header section-header--page">
                <h1>红心大战</h1>
                <p>本地人机 · 浏览器内演算 · 含规则教程</p>
            </div>
        </div>
        <div class="tutor" style="display: none;"> </div>

        <div class="list-all card-game-lobby">
            <div class="card-game-lobby__panel">
                <p class="card-game-lobby__lead">单机对局，无联网房间。</p>
                <ul class="list list-unstyled list-table"></ul>
                <div class="card-game-lobby__actions">
                    <button type="button" class="btn btn-primary btn-start-ai"><span class="card-icon" aria-hidden="true">◆</span> 开始对局</button>
                    <button type="button" class="btn btn-default" data-action="lobby.tutor"><span class="card-icon" aria-hidden="true">※</span> 规则教程</button>
                </div>
                <p class="card-game-lobby__note">本地演算 · 无数据上传</p>
            </div>
        </div>

        <div class="card-game-viewport">
        <div class="card-game-stage">
        <svg class="decor" viewBox="0 0 500 500" aria-hidden="true"> </svg>
        <svg class="tutor-svg-2" viewBox="0 0 500 500" aria-hidden="true"> </svg>
        <div class="bodypad hearts">
            <svg class="hearts-svg" viewBox="0 0 500 500" style="position:absolute;width:500px;"> </svg>
            <svg class="tutor-svg" viewBox="0 0 500 500" style="position:absolute;width:500px;display:none"> </svg>
            <div class="hearts-btns"></div>
        </div>
        </div>
        <div class="hearts-btns-down card-game-dock" aria-live="polite"></div>
        </div>

        <div class="chat" style="position: fixed;bottom:15px;right:15px;display: none;">
            <button type="button" class="btn-exit btn btn-default" title="再按一次确认离开" aria-label="离开对局，再按一次确认"><span class="card-icon" aria-hidden="true">⎋</span> 离开</button>
        </div>

        <footer class="site-footer" role="contentinfo">
            <p>© 2026 noomings · 非商用</p>
        </footer>
        <script src="/assets/js/site-shell.js" defer></script>
</body>

</html>
