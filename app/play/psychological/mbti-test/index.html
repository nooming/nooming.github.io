<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="20 题轻量 MBTI · 四维倾向 · 仅供娱乐参考。">
    <meta name="keywords" content="MBTI测试,性格测试,心理测试,人格测试">
    <meta name="author" content="nooming">
    <title>MBTI · noomings</title>
    <script src="/assets/js/shell-prefs-boot.js"></script>
    <link rel="stylesheet" href="../../../../assets/css/common.css">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="../assets/css/quiz-shell.css">
    <link rel="stylesheet" href="../assets/css/quiz-theme-mbti.css">
</head>
<body class="page-container">
    <a class="quiz-skip" href="#quiz-main">跳到问卷</a>

    <div class="page-header">
        <div class="section-header section-header--page">
            <h1>MBTI 性格测试</h1>
            <p>20 题 · 四维倾向与简述。</p>
        </div>
    </div>

    <main id="quiz-main" class="test-container app-panel">
        <p class="test-intro">选更贴近日常偏好的一项。仅供娱乐参考，不构成心理诊断。</p>

        <p class="quiz-live" id="quiz-live" role="status" aria-live="polite"></p>

        <div class="progress-text">
            <span id="progress-text">问题 1 / 20</span>
        </div>
        <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="答题进度"
             aria-valuemin="1" aria-valuemax="20" aria-valuenow="1">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div id="questions-container"></div>

        <div class="btn-container" id="quiz-controls">
            <button class="btn btn--quiet" id="prev-btn" type="button" disabled>上一题</button>
            <button class="btn btn-primary" id="next-btn" type="button">下一题</button>
        </div>

        <div class="result-container" id="result-container" role="region" aria-labelledby="result-heading" tabindex="-1">
            <p class="result-disclaimer">仅供娱乐参考，不构成心理诊断或专业评估。</p>
            <p class="result-resume" id="result-resume" hidden>已恢复上次作答与结果。</p>
            <h2 class="result-title" id="result-heading">你的MBTI类型是</h2>
            <div class="result-type" id="result-type"></div>
            <div class="result-description" id="result-description"></div>
            <div class="dimension-section">
                <h3 class="dimension-heading">四个维度倾向</h3>
                <div class="dimension-bars" id="dimension-bars"></div>
                <p class="result-ties" id="result-ties"></p>
            </div>
            <div class="result-actions">
                <button type="button" class="btn btn-primary" id="copy-result-btn">复制结果</button>
                <button type="button" class="btn btn--quiet" id="share-result-btn">分享</button>
                <button type="button" class="btn btn--quiet" id="restart-btn">重新测试</button>
            </div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>

    <script src="../../../../assets/js/utils.js" defer></script>
    <script src="../assets/js/quiz-engine.js" defer></script>
    <script src="../assets/js/mbti-test.js" defer></script>
    <script src="/assets/js/shell-preferences.js" defer></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
