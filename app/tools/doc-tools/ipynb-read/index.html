<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="本地打开 .ipynb 预览 Markdown 与代码单元，不执行代码。">
    <title>读 ipynb · noomings</title><link rel="stylesheet" href="../../../../assets/css/common.css">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="/app/tools/doc-tools/assets/css/doc-tools.css">
</head>
<body class="page-container">
    <div class="page-header">
        <div class="section-header section-header--page">
            <h1>读 ipynb</h1>
            <p>本地预览笔记本内容，不跑内核。</p>
        </div>
    </div>

    <main class="app-panel doc-panel">
        <p class="doc-hint">网页版只读。需在本地 Jupyter 中编辑运行时，请用 <a href="../windows/">Windows 桌面版 nbopen</a>。</p>
        <div class="doc-upload">
            <label for="ipynb-file" class="doc-upload-btn">选择 .ipynb</label>
            <input type="file" id="ipynb-file" accept=".ipynb,application/json">
            <p id="file-name" class="doc-file-name">未选择文件</p>
        </div>
        <p id="status" class="doc-status" aria-live="polite">请选择笔记本</p>
        <div id="cells" class="ipynb-cells"></div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>
    <script src="../../../read/markdown/assets/js/vendor/marked.min.js"></script>
    <script src="../../../../assets/js/utils.js"></script>
    <script type="module" src="assets/js/ipynb-read.js"></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
