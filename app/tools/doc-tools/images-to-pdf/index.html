<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="多图按文件名编号合并 PDF · 浏览器端处理 · 文件不发送至服务器。">
    <title>图片转 PDF · noomings</title>
    <script src="/assets/js/shell-prefs-boot.js"></script>
    <link rel="stylesheet" href="../../../../assets/css/common.css">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
<link rel="stylesheet" href="/assets/css/site-shell.css">
<link rel="stylesheet" href="/app/tools/doc-tools/assets/css/doc-tools.css">
</head>
<body class="page-container">
    <div class="page-header">
        <div class="section-header section-header--page">
            <h1>图片 → PDF</h1>
            <p>编号排序 · 预览区可调页序 · 文件不发送至服务器。</p>
        </div>
    </div>

    <main class="app-panel doc-panel">
        <p class="doc-hint">支持 PNG / JPG / WebP · 预览区 ← → 可调整合并顺序。</p>
        <div class="doc-upload">
            <label for="img-files" class="btn-primary doc-upload-btn">选择多张图片</label>
            <input type="file" id="img-files" accept="image/*" multiple>
            <p id="file-name" class="doc-file-name">未选择文件</p>
        </div>
        <div class="doc-actions">
            <button type="button" class="btn-primary doc-primary-btn" id="convert-btn" disabled>合并为 PDF</button>
            <p id="status" class="doc-status" aria-live="polite">请选择图片</p>
        </div>
        <div class="doc-progress" hidden id="progress-wrap"><span id="progress-bar"></span></div>
        <div id="preview" class="doc-preview-list" hidden></div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>
    <script src="../../../../assets/js/utils.js"></script>
    <script type="module" src="assets/js/images-to-pdf.js"></script>
    <script src="/assets/js/shell-preferences.js" defer></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
