<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="PDF 逐页导出 PNG · 预览选页 · 文件不发送至服务器。">
    <title>PDF 转图片 · noomings</title><link rel="stylesheet" href="../../../../assets/css/common.css">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="/app/tools/doc-tools/assets/css/doc-tools.css">
</head>
<body class="page-container">
    <div class="page-header">
        <div class="section-header section-header--page">
            <h1>PDF → 图片</h1>
            <p>预览选页 · 单页 PNG 或全量 ZIP · 文件不发送至服务器。</p>
        </div>
    </div>

    <main class="app-panel doc-panel">
        <p class="doc-hint">对应桌面工具 <strong>pdf2img</strong>。大 PDF 或高倍率会占较多内存，建议先选 2×。</p>
        <div class="doc-upload">
            <label for="pdf-file" class="doc-upload-btn">选择 PDF</label>
            <input type="file" id="pdf-file" accept=".pdf,application/pdf">
            <p id="file-name" class="doc-file-name">未选择文件</p>
        </div>
        <div class="doc-options">
            <label>渲染倍率
                <select id="zoom">
                    <option value="1.5">1.5×</option>
                    <option value="2" selected>2×（默认）</option>
                    <option value="3">3×</option>
                </select>
            </label>
        </div>
        <div class="doc-page-picker" id="page-picker" hidden>
            <p class="doc-page-picker__hint">预览仅用于选页，清晰度以下载时的「渲染倍率」为准。</p>
            <div class="doc-pdf-preview" id="pdf-preview" aria-live="polite"></div>
            <div class="doc-page-nav">
                <button type="button" class="doc-page-nav__btn" id="page-prev" disabled aria-label="上一页">‹</button>
                <label class="doc-page-nav__field">第
                    <input type="number" id="page-num" min="1" value="1" inputmode="numeric">
                    <span id="page-total">/ 1</span> 页
                </label>
                <button type="button" class="doc-page-nav__btn" id="page-next" disabled aria-label="下一页">›</button>
            </div>
        </div>
        <div class="doc-actions">
            <button type="button" class="doc-secondary-btn" id="page-png-btn" disabled>下载当前页 PNG</button>
            <button type="button" class="doc-primary-btn" id="convert-btn" disabled>全部页 · ZIP</button>
            <p id="status" class="doc-status" aria-live="polite">请选择 PDF</p>
        </div>
        <div class="doc-progress" hidden id="progress-wrap"><span id="progress-bar"></span></div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>
    <script src="../../../../assets/js/utils.js"></script>
    <script type="module" src="assets/js/pdf-to-images.js?v=20260323"></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
