<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="每行一项 · 随机保留一项 · 记录可复制。">
    <meta name="keywords" content="随机选择,多选随机,决定,抽签,决策工具">
    <meta name="author" content="nooming">
    <title>多选随机 · noomings</title>
    <script src="/assets/js/shell-prefs-boot.js"></script>
    <link rel="stylesheet" href="../../../../assets/css/common.css">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="../assets/css/quick-choice.css">
</head>
<body class="page-container quick-choice-page">
    <div class="page-header">
        <div class="section-header section-header--page">
            <h1>多选随机</h1>
            <p>每行一项 · 随机保留一项。</p>
        </div>
    </div>

    <main class="decision-tool-main">
        <div class="app-panel qc-panel">
            <label class="qc-field" for="qc-input">候选项</label>
            <textarea id="qc-input" class="qc-textarea" placeholder="每行一项，例如：&#10;火锅&#10;烤肉&#10;寿司"></textarea>
            <p class="qc-hint">每行一项 · 行首的 -、* 或 1. 会自动去掉 · 最多 500 项，仅存本机。</p>

            <div class="qc-presets" role="group" aria-label="示例">
                <button type="button" class="qc-chip" data-preset="abcd">A / B / C / D</button>
                <button type="button" class="qc-chip" data-preset="numbers">1–4</button>
                <button type="button" class="qc-chip" data-preset="food">今天吃什么</button>
                <button type="button" class="qc-chip" data-preset="yesno">是 / 否</button>
            </div>

            <div class="qc-actions">
                <button type="button" class="btn-primary" id="qc-draw">随机抽一项</button>
            </div>

            <div class="qc-result" id="qc-result">
                <p class="qc-result__label">抽中</p>
                <p class="qc-result__value is-empty" id="qc-result-value" aria-live="polite">还没有抽取。</p>
                <div class="qc-result__actions">
                    <button type="button" class="btn-quiet" id="qc-copy" disabled>复制结果</button>
                </div>
            </div>

            <section class="qc-history" aria-labelledby="qc-history-title">
                <div class="qc-history__head">
                    <h2 id="qc-history-title">最近结果</h2>
                    <button type="button" class="btn-quiet" id="qc-clear" disabled>清空</button>
                </div>
                <ol class="qc-history__list" id="qc-history-list"></ol>
                <p class="qc-history__empty" id="qc-history-empty">还没有记录。</p>
            </section>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>

    <script src="../../../../assets/js/utils.js" defer></script>
    <script src="../assets/js/quick-choice.js" defer></script>
    <script src="/assets/js/shell-preferences.js" defer></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
