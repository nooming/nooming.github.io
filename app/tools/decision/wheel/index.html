<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="写下选项，转盘随机抽出一项 · 支持预设、历史与全屏。">
    <meta name="keywords" content="转盘,随机选择,抽奖,决定,决策工具">
    <meta name="author" content="nooming">
    <title>转盘 · noomings</title>
    <script src="/assets/js/shell-prefs-boot.js"></script>
    <link rel="stylesheet" href="../../../../assets/css/common.css">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="../assets/css/wheel-page.css">
</head>
<body class="page-container wheel-page">
    <div class="page-header">
        <div class="section-header section-header--page">
            <h1>转盘</h1>
            <p>写下选项，转出一项 · 结果留在本机。</p>
        </div>
    </div>

    <main class="wheel-main">
        <div class="app-panel wheel-panel">
            <div class="wheel-stage">
                <div class="wheel-canvas-wrap" id="wheel-canvas-wrap">
                    <canvas id="wheel-canvas" role="img" aria-label="随机转盘"></canvas>
                    <div class="wheel-pointer" aria-hidden="true"></div>
                    <button type="button" class="wheel-hub" id="wheel-hub" aria-label="开始转动转盘">转</button>
                </div>

                <p class="wheel-result is-empty" id="wheel-result" role="status" aria-live="polite">还没开始。</p>

                <div class="wheel-stage-actions">
                    <button type="button" class="btn-primary" id="wheel-spin">开始转</button>
                    <button type="button" class="btn-quiet" id="wheel-copy" disabled>复制结果</button>
                    <button type="button" class="btn-quiet" id="wheel-expand">全屏</button>
                </div>
            </div>

            <aside class="wheel-editor" aria-label="转盘选项">
                <label class="wheel-label" for="wheel-entries">选项（每行一个）</label>
                <textarea id="wheel-entries" class="wheel-textarea" spellcheck="false"></textarea>
                <div class="wheel-meta">
                    <span id="wheel-count">0 / 24 项</span>
                    <span>最多 24 项</span>
                </div>

                <div class="wheel-actions">
                    <button type="button" class="btn-quiet" id="wheel-shuffle">打乱顺序</button>
                    <button type="button" class="btn-quiet" id="wheel-clear">清空</button>
                </div>

                <div class="wheel-presets" role="group" aria-label="预设">
                    <button type="button" class="wheel-preset" data-preset="food">吃什么</button>
                    <button type="button" class="wheel-preset" data-preset="who">谁来做</button>
                    <button type="button" class="wheel-preset" data-preset="abcd">A–D</button>
                    <button type="button" class="wheel-preset" data-preset="numbers">1–6</button>
                </div>

                <section class="wheel-history" aria-labelledby="wheel-history-title">
                    <div class="wheel-history__head">
                        <h2 id="wheel-history-title">最近结果</h2>
                        <button type="button" class="btn-quiet" id="wheel-history-clear" disabled>清空</button>
                    </div>
                    <ol class="wheel-history__list" id="wheel-history-list"></ol>
                    <p class="wheel-history__empty" id="wheel-history-empty">还没有转过。</p>
                </section>
            </aside>
        </div>
    </main>

    <button type="button" class="wheel-exit" id="wheel-exit">退出全屏</button>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>

    <script src="../../../../assets/js/utils.js" defer></script>
    <script src="../assets/js/wheel.js" defer></script>
    <script src="/assets/js/shell-preferences.js" defer></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
