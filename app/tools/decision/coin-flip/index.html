<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFA00">
    <title>抛硬币 · noomings</title>
    <meta name="description" content="正面或反面随机 · 本地统计与最近记录。">
    <meta name="keywords" content="抛硬币,在线抛硬币,随机选择,正反面,决策工具">
    <meta name="author" content="nooming">
    <meta property="og:type" content="website">
    <meta property="og:title" content="抛硬币">
    <meta property="og:description" content="正反面随机 · 本地统计与最近记录。">
    <script src="/assets/js/shell-prefs-boot.js"></script>
    <link rel="stylesheet" href="../../../../assets/css/common.css">
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="stylesheet" href="/assets/css/site-shell.css">
    <link rel="stylesheet" href="../assets/css/coin-page.css">
</head>
<body class="page-container coin-page">
    <div class="page-header">
        <div class="section-header section-header--page">
            <h1>抛硬币</h1>
            <p>正反面随机 · 本地统计与最近记录。</p>
        </div>
    </div>

    <main class="coin-main">
        <div class="app-panel coin-panel">
            <div class="coin-stage">
                <div class="coin" id="coin" aria-hidden="true">
                    <div class="coin-face coin-face--heads">正</div>
                    <div class="coin-face coin-face--tails">反</div>
                </div>
                <p class="coin-status" id="coin-status" role="status" aria-live="polite">准备好了就抛一次</p>
            </div>

            <div class="coin-actions">
                <button type="button" class="btn-primary" id="flip-btn">抛一次</button>
                <button type="button" class="btn-quiet" id="copy-btn" disabled>复制结果</button>
                <button type="button" class="btn-quiet" id="reset-btn" disabled>重置统计</button>
            </div>

            <dl class="coin-stats">
                <div>
                    <dt>正面</dt>
                    <dd id="stat-heads">0</dd>
                </div>
                <div>
                    <dt>反面</dt>
                    <dd id="stat-tails">0</dd>
                </div>
                <div>
                    <dt>总次数</dt>
                    <dd id="stat-total">0</dd>
                </div>
            </dl>
            <p class="coin-prob" id="coin-prob">还没有抛过。</p>

            <section class="coin-history" aria-labelledby="coin-history-title">
                <div class="coin-history__head">
                    <h2 id="coin-history-title">最近结果</h2>
                </div>
                <ol class="coin-history__list" id="coin-history-list"></ol>
                <p class="coin-history__empty" id="coin-history-empty">还没有记录。</p>
            </section>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商用</p>
    </footer>

    <script src="../../../../assets/js/utils.js" defer></script>
    <script src="../../../../assets/js/sound-fx.js" defer></script>
    <script src="../assets/js/coin.js" defer></script>
    <script src="/assets/js/shell-preferences.js" defer></script>
    <script src="/assets/js/site-shell.js" defer></script>
</body>
</html>
