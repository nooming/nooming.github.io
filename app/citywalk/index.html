<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff7e5f">
    <meta name="description" content="全国Citywalk定制路线规划，发现城市之美，支持北京、上海、广州、深圳、成都、杭州、香港、澳门等城市">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚶</text></svg>">
    <title>全国Citywalk · 定制路线规划</title>
    <link rel="preconnect" href="https://webapi.amap.com">
    <link rel="preconnect" href="https://restapi.amap.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <script type="text/javascript">
        // 高德 Key：优先 /api/citywalk/config/public，失败时回退到内置值（保障 GitHub Pages 离线可用）
        window.__CW_AMAP_FALLBACK = {
            key: '4ade0b9a9942f8c1d5b470525887a258',
            securityJsCode: 'dd98c8e83161c0d87e596a17f2d29750'
        };
        window.__amapReady = false;
        function onAMapLoaded() {
            window.__amapReady = true;
            if (typeof window.__cwOnAMapReady === 'function') {
                window.__cwOnAMapReady();
            }
        }
        function mapLoadError() {
            var toast = document.getElementById('errorToast');
            if (toast) {
                toast.textContent = '地图加载失败，请刷新页面重试';
                toast.classList.add('show');
            }
        }
        (function loadAmapPreferConfig() {
            var fb = window.__CW_AMAP_FALLBACK;
            var host = window.location.hostname;
            var apiBase = (host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host === '::1')
                ? 'http://localhost:5000'
                : 'https://noomings-backend.zeabur.app';
            function inject(key, security) {
                window._AMapSecurityConfig = { securityJsCode: security || fb.securityJsCode };
                var s = document.createElement('script');
                s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(key)
                    + '&plugin=AMap.Marker,AMap.InfoWindow,AMap.Geocoder,AMap.Weather';
                s.async = true;
                s.defer = true;
                s.onload = onAMapLoaded;
                s.onerror = mapLoadError;
                document.head.appendChild(s);
            }
            var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
            var tid = setTimeout(function () {
                if (ctrl) try { ctrl.abort(); } catch (_) {}
            }, 2500);
            fetch(apiBase + '/api/citywalk/config/public', {
                method: 'GET',
                headers: { 'Accept': 'application/json' },
                signal: ctrl ? ctrl.signal : undefined
            }).then(function (r) { return r.json(); }).then(function (data) {
                clearTimeout(tid);
                var key = data && data.amap_js_key ? String(data.amap_js_key).trim() : '';
                var sec = data && data.amap_js_security_code ? String(data.amap_js_security_code).trim() : '';
                if (key) inject(key, sec || fb.securityJsCode);
                else inject(fb.key, fb.securityJsCode);
            }).catch(function () {
                clearTimeout(tid);
                inject(fb.key, fb.securityJsCode);
            });
        })();
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div id="container"></div>

    <button class="back-home-fab" type="button" aria-label="返回站内首页" title="返回首页" onclick="window.location.href='../../'">
        ←
    </button>

    <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite" aria-hidden="true">
        <div class="loading-card">
            <div class="loading-spinner" aria-hidden="true"></div>
            <div class="loading-title" id="loadingTitle">正在规划步行路线，可能需要十几秒</div>
            <p class="loading-sub" id="loadingSub">请稍候，结果就绪后会自动展示</p>
            <button type="button" class="loading-retry" id="btnLoadingRetry" hidden>重试</button>
        </div>
    </div>

    <div class="error-toast" id="errorToast" role="alert" aria-live="assertive"></div>

    <div class="control-panel">
        <div class="panel-header">
            <h2>
                <span class="panel-header-icon">🚶</span>
                <span class="panel-header-title-text">Citywalk</span>
            </h2>
        </div>

        <div class="panel-env">
            <div class="panel-env-bar">
                <details class="city-switcher" id="citySwitcherDetails">
                    <summary class="city-switcher-summary">
                        <span class="city-switcher-icon">📍</span>
                        <span id="currentCity" class="city-switcher-name">定位中...</span>
                        <span class="city-switcher-chevron">▾</span>
                    </summary>
                    <div class="city-switcher-body">
                        <div class="city-input-row">
                            <label for="cityInput" class="sr-only">切换城市</label>
                            <input type="text" id="cityInput" class="city-input" placeholder="输入城市名称">
                            <button id="citySwitchBtn" type="button" class="city-switch-btn">切换</button>
                        </div>
                        <div class="hot-cities-row" role="group" aria-label="热门城市快捷切换">
                            <button type="button" class="hot-city-tag" data-city="北京">北京</button>
                            <button type="button" class="hot-city-tag" data-city="上海">上海</button>
                            <button type="button" class="hot-city-tag" data-city="广州">广州</button>
                            <button type="button" class="hot-city-tag" data-city="成都">成都</button>
                            <button type="button" class="hot-city-tag" data-city="香港">香港</button>
                        </div>
                    </div>
                </details>
                <div class="weather-chip" id="weatherCard" role="button" tabindex="0" aria-label="点击刷新天气" title="点击刷新天气">
                    <span class="weather-chip-icon" id="weatherIcon">🌤️</span>
                    <span class="weather-chip-text">
                        <span class="weather-chip-title" id="weatherTitle">加载中</span>
                        <span class="weather-chip-desc" id="weatherDesc">天气</span>
                    </span>
                </div>
            </div>
        </div>

        <nav class="panel-tabs" role="tablist" aria-label="规划方式">
            <button type="button" class="panel-tab panel-tab--active" role="tab" id="tabBtnAgent" data-tab="agent" aria-selected="true" aria-controls="tab-panel-agent">智能规划</button>
            <button type="button" class="panel-tab" role="tab" id="tabBtnManual" data-tab="manual" aria-selected="false" aria-controls="tab-panel-manual">手动规划</button>
            <button type="button" class="panel-tab panel-tab--disabled" role="tab" id="tabBtnResult" data-tab="result" aria-selected="false" aria-controls="tab-panel-result" hidden disabled>路线结果</button>
        </nav>

        <div class="panel-body">
            <section id="panel-shared" class="panel-shared plan-mode-route" aria-label="选点与模式">
                <div class="search-box search-box--compact">
                    <label for="searchInput" class="sr-only">搜索地址</label>
                    <input type="text" id="searchInput" placeholder="🔍 搜索地址，回车定位">
                </div>

                <div class="plan-mode-group" role="group" aria-label="规划模式">
                    <button type="button" class="plan-mode-btn plan-mode-btn--active" id="modeBtnRoute">起终点路线</button>
                    <button type="button" class="plan-mode-btn" id="modeBtnLoop">环线探索</button>
                </div>

                <div class="pickup-strip status-group">
                    <div class="status-card" id="startCard">
                        <div class="label">📍 起点</div>
                        <div class="value" id="startValue">点击地图选择</div>
                    </div>
                    <div class="status-card status-card--destination" id="endCard">
                        <div class="label">🏁 终点</div>
                        <div class="value" id="endValue">点击地图选择</div>
                    </div>
                </div>

                <div class="plan-time-mini time-slider-group">
                    <span class="plan-time-mini-label">计划时长</span>
                    <label for="planTimeSlider" class="sr-only">计划游玩时间（分钟）</label>
                    <input type="range" id="planTimeSlider" min="30" max="240" value="60">
                    <span id="planTimeValue" class="time-slider-value plan-time-mini-value">60 分钟</span>
                </div>

                <div class="plan-prefs" aria-label="偏好与节奏">
                    <div class="filter-title" id="poiPrefTitleShared">打卡偏好</div>
                    <div class="poi-type-group" role="group" aria-labelledby="poiPrefTitleShared">
                        <button type="button" class="poi-type-btn active" data-type="无偏好" aria-pressed="true">无偏好</button>
                        <button type="button" class="poi-type-btn" data-type="自然" aria-pressed="false">🌳 自然</button>
                        <button type="button" class="poi-type-btn" data-type="历史" aria-pressed="false">🏛️ 历史</button>
                        <button type="button" class="poi-type-btn" data-type="文创" aria-pressed="false">✨ 文创</button>
                        <button type="button" class="poi-type-btn" data-type="花店" aria-pressed="false">💐 花店</button>
                        <button type="button" class="poi-type-btn" data-type="咖啡甜品" aria-pressed="false">☕ 咖啡甜品</button>
                        <button type="button" class="poi-type-btn" data-type="商场" aria-pressed="false">🛍️ 商场</button>
                    </div>
                    <div class="filter-title" id="visitPaceTitle">逛法节奏</div>
                    <div class="visit-pace-group poi-type-group" role="group" aria-labelledby="visitPaceTitle">
                        <button type="button" class="visit-pace-btn poi-type-btn active" data-pace="checkin" aria-pressed="true">密集打卡</button>
                        <button type="button" class="visit-pace-btn poi-type-btn" data-pace="relaxed" aria-pressed="false">慢慢逛</button>
                    </div>
                    <div class="filter-title" id="timeOfDayTitle">出行时段</div>
                    <div class="time-of-day-group poi-type-group" role="group" aria-labelledby="timeOfDayTitle">
                        <button type="button" class="time-of-day-btn poi-type-btn active" data-tod="now" aria-pressed="true">现在</button>
                        <button type="button" class="time-of-day-btn poi-type-btn" data-tod="afternoon" aria-pressed="false">午后</button>
                        <button type="button" class="time-of-day-btn poi-type-btn" data-tod="evening" aria-pressed="false">傍晚</button>
                        <button type="button" class="time-of-day-btn poi-type-btn" data-tod="night" aria-pressed="false">夜晚</button>
                    </div>
                </div>

                <div class="pinned-seeds" id="pinnedSeedsPanel" hidden>
                    <div class="pinned-seeds-head">
                        <span class="filter-title">必去点（最多 3 个）</span>
                        <span class="pinned-seeds-hint">搜索结果或长按地图可订为必去</span>
                    </div>
                    <div class="pinned-seeds-list" id="pinnedSeedsList"></div>
                </div>

                <div class="recent-routes recent-routes--main" id="recentRoutesMain" hidden>
                    <div class="recent-routes-header">
                        <span class="filter-title">最近路线</span>
                        <button type="button" class="recent-routes-clear" id="btnClearRecentMain">清空</button>
                    </div>
                    <div class="recent-routes-list" id="recentRoutesListMain"></div>
                </div>

                <div class="share-restore-banner" id="shareRestoreBanner" hidden>
                    <span id="shareRestoreText">已从链接载入参数</span>
                    <button type="button" class="btn btn-agent-plan" id="btnShareReplan">按此重新规划</button>
                </div>
            </section>

            <section class="tab-panel tab-panel--active" id="tab-panel-agent" data-tab-panel="agent" role="tabpanel" aria-labelledby="tabBtnAgent">
                <div class="agent-box">
                    <p class="agent-hint">描述玩法偏好即可；起终点可在地图或搜索选定。上方偏好与节奏会随规划一并提交。</p>
                    <label for="agentQueryInput" class="sr-only">智能规划需求描述</label>
                    <textarea id="agentQueryInput" class="agent-query-input" rows="3" placeholder="例：静安寺—南京西路，约90分钟，偏好咖啡馆"></textarea>
                    <section class="agent-inspire" aria-label="灵感推荐">
                        <div class="agent-inspire-row">
                            <label class="inspire-toggle">
                                <input type="checkbox" id="inspireToggle" checked>
                                <span>灵感推荐</span>
                            </label>
                            <button type="button" class="btn-inspire-cards" id="btnInspireCards">浏览推荐地点</button>
                        </div>
                        <div class="inspire-cards" id="inspireCards" hidden></div>
                    </section>
                    <button type="button" class="btn btn-agent-plan" id="btnAgentPlan">智能规划路线</button>
                </div>
            </section>

            <section class="tab-panel" id="tab-panel-manual" data-tab-panel="manual" role="tabpanel" aria-labelledby="tabBtnManual" hidden>
                <div class="tips-box tips-box--compact" id="planModeTips">
                    <span class="tips-box-text">自然语言描述需求？请使用「智能规划」</span>
                    <button type="button" class="tips-box-dismiss" id="btnDismissTips" aria-label="关闭提示">✕</button>
                </div>

                <div class="btn-group btn-group--manual-primary">
                    <button class="btn btn-plan" id="btnPlan" type="button" disabled>先在地图上选起终点</button>
                </div>
                <button class="btn btn-ghost btn-reset" id="btnReset" type="button">重置选择</button>

                <details class="manual-filters">
                    <summary>路线风格</summary>
                    <div class="filter-group">
                        <div class="filter-title" id="routeStyleTitle">路线风格</div>
                        <div class="route-style-group poi-type-group" role="group" aria-labelledby="routeStyleTitle">
                            <button type="button" class="route-style-btn poi-type-btn active" data-style="balanced" aria-pressed="true">均衡</button>
                            <button type="button" class="route-style-btn poi-type-btn" data-style="atmosphere_first" aria-pressed="false">氛围优先</button>
                            <button type="button" class="route-style-btn poi-type-btn" data-style="efficiency_first" aria-pressed="false">省力直达</button>
                        </div>
                    </div>
                </details>

                <details class="manual-history" id="manualHistoryDetails" style="display:none;">
                    <summary>全部历史路线</summary>
                    <div class="recent-routes" id="recentRoutes">
                        <div class="recent-routes-header">
                            <button type="button" class="recent-routes-clear" id="btnClearRecent">清空</button>
                        </div>
                        <div class="recent-routes-list" id="recentRoutesList"></div>
                    </div>
                </details>
            </section>

            <section class="tab-panel" id="tab-panel-result" data-tab-panel="result" role="tabpanel" aria-labelledby="tabBtnResult" hidden>
                <div class="result-toolbar">
                    <button type="button" class="btn-link-back-plan" id="btnBackToPlan">← 返回调整路线</button>
                </div>

                <div class="result-area" id="resultArea" style="display:none;">
                    <div class="result-header">路线规划完成</div>
                    <p class="result-narrative" id="resultNarrative"></p>
                    <div class="result-stats-row">
                        <div class="result-stat">
                            <div class="label">距离</div>
                            <div class="value highlight" id="distanceValue">--</div>
                        </div>
                        <div class="result-stat result-stat--duration">
                            <div class="label" title="计划为滑块目标；预计为步行+打卡，余下为自由安排">耗时</div>
                            <div class="value highlight duration-stat-value">
                                <span class="duration-plan" id="durationPlanValue">--</span>
                                <span class="duration-est" id="durationEstValue">--</span>
                                <span class="duration-free" id="durationFreeValue" style="display:none;"></span>
                            </div>
                        </div>
                        <div class="result-stat">
                            <div class="label">打卡</div>
                            <div class="value highlight" id="poiCountValue">0</div>
                        </div>
                    </div>
                    <div class="weather-nudge weather-nudge--result" id="weatherNudgeResult" style="display:none;"></div>
                    <div class="poi-list" id="poiList"></div>
                    <div class="route-actions" id="routeActions" style="display:none;">
                        <button type="button" class="btn-route-action" id="btnNextStop">🚶 下一站</button>
                        <button type="button" class="btn-route-action" id="btnOpenAmap">🧭 起终点导航</button>
                    </div>
                    <div class="result-share-block">
                        <div class="result-share-label">分享与导出</div>
                        <div class="result-actions-row">
                            <button class="btn-generate-plan btn-copy-link" id="btnCopyShareLink" type="button">复制链接</button>
                            <button class="btn-generate-plan" id="btnGeneratePlan" type="button">生成游记攻略</button>
                            <button class="btn-generate-plan btn-share-image" id="btnShareImage" type="button">导出分享图</button>
                        </div>
                    </div>
                    <div class="result-chat result-chat--open" id="resultChatDetails">
                        <div class="result-chat-label">对话优化路线</div>
                        <div class="agent-chat-section">
                            <p class="result-chat-hint">用一句话微调时长、顺序或打卡偏好</p>
                            <div class="agent-chat-log" id="agentChatLog" role="log" aria-live="polite"></div>
                            <div class="agent-chat-input-row">
                                <label for="agentChatInput" class="sr-only">对话调整输入</label>
                                <input type="text" id="agentChatInput" class="agent-chat-input" placeholder="例：调整为 90 分钟、减少步行">
                                <button type="button" class="btn-agent-chat-send" id="btnAgentChat">发送</button>
                            </div>
                        </div>
                    </div>
                    <details class="result-notes" id="resultNotesDetails" hidden>
                        <summary>路线说明</summary>
                        <div class="result-notes-body">
                            <div class="route-end-hint" id="routeEndHint" style="display:none;"></div>
                            <div class="route-feedback" id="routeFeedback" style="display:none;"></div>
                            <div class="weather-nudge" id="weatherNudge" style="display:none;"></div>
                        </div>
                    </details>
                </div>
            </section>
        </div>
    </div>

    <script src="assets/js/core/cw-state.js"></script>
    <script src="assets/js/map/cw-weather.js"></script>
    <script src="assets/js/map/cw-map.js"></script>
    <script src="assets/js/ui/cw-tabs.js"></script>
    <script src="assets/js/plan/cw-route.js"></script>
    <script src="assets/js/plan/cw-agent.js"></script>
    <script src="assets/js/share/cw-share.js"></script>
    <script src="assets/js/share/cw-link.js"></script>
    <script src="assets/js/ui/cw-actions.js"></script>
    <script src="assets/js/plan/cw-inspire.js"></script>
    <script src="assets/js/core/app.js"></script>
</body>
</html>
