<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="20 题趣味 MBTI；展示四维倾向，仅供娱乐。">
    <meta name="keywords" content="MBTI测试,性格测试,心理测试,人格测试">
    <title>MBTI · noomings</title>

    <link rel="apple-touch-icon" sizes="180x180" href="../../../assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../assets/icons/favicon-16x16.png">
    <link rel="manifest" href="../../../assets/icons/site.webmanifest">
    <link rel="shortcut icon" href="../../../assets/icons/favicon.ico">

    <link rel="stylesheet" href="../../../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/quiz-shell.css">
    <link rel="stylesheet" href="../assets/css/quiz-theme-mbti.css">
</head>
<body class="page-container">
    <div class="page-header">
        <div class="header-top">
            <a href="../" class="back-btn">返回</a>
        </div>
        <div class="section-header section-header--page">
            <h1>MBTI性格测试</h1>
            <p>20 题趣味问卷；四维倾向与简述。</p>
        </div>
    </div>

    <div class="test-container app-panel">
        <p class="test-intro">按直觉选择更贴近你的做法。本测试仅供娱乐，不是临床诊断。</p>

        <div class="progress-text">
            <span id="progress-text">问题 1 / 20</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div id="questions-container"></div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="prev-btn" onclick="previousQuestion()" disabled>上一题</button>
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">下一题</button>
        </div>

        <div class="result-container" id="result-container">
            <p class="result-disclaimer">本测试仅供娱乐参考，不构成临床诊断或专业心理评估。</p>
            <h2 class="result-title">你的MBTI类型是</h2>
            <div class="result-type" id="result-type"></div>
            <div class="result-description" id="result-description"></div>
            <div class="dimension-section">
                <h3 class="dimension-heading">四个维度倾向</h3>
                <div class="dimension-bars" id="dimension-bars"></div>
                <p class="result-ties" id="result-ties"></p>
            </div>
            <button class="restart-btn" onclick="restartTest()">重新测试</button>
        </div>
    </div>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商业使用</p>
    </footer>

    <script>
        const STORAGE_PREFIX = 'mbti_q';

        const questions = [
            { q: "在聚会中，你通常", a: "主动与很多人交流", b: "与少数人深入交谈", dim: "EI" },
            { q: "感觉精力不足时，你更想", a: "找人一起做事或聊天", b: "独自待着静一静", dim: "EI" },
            { q: "遇到新想法时，你更常", a: "边说边理清思路", b: "先想清楚再开口", dim: "EI" },
            { q: "在压力下，你更可能", a: "变得更想活动、找人商量", b: "变得更想安静、自己消化", dim: "EI" },
            { q: "学习或工作时，你更舒服的是", a: "和他人一起推进", b: "独自专注完成", dim: "EI" },

            { q: "学习新事物时，你更依赖", a: "动手实践和具体例子", b: "概念框架和抽象理解", dim: "SN" },
            { q: "你更关注", a: "事实和细节", b: "可能性和整体", dim: "SN" },
            { q: "描述一件事时，你更常", a: "讲清楚具体发生了什么", b: "讲其中的含义和模式", dim: "SN" },
            { q: "做方案时，你更看重", a: "当下可验证、可落地的信息", b: "方向、愿景和长远可能", dim: "SN" },
            { q: "回忆一段经历时，你更容易想起", a: "具体场景和细节", b: "整体氛围和启发", dim: "SN" },

            { q: "做决定时，你更注重", a: "逻辑和客观分析", b: "价值观和他人感受", dim: "TF" },
            { q: "给出反馈时，你更可能", a: "直接指出问题", b: "先照顾对方感受", dim: "TF" },
            { q: "你更重视", a: "公正和原则", b: "和谐与体谅", dim: "TF" },
            { q: "争论时，你更在意", a: "道理是否站得住", b: "关系会不会受伤", dim: "TF" },
            { q: "衡量对错时，你更依赖", a: "客观标准", b: "个人价值观", dim: "TF" },

            { q: "安排日程时，你更喜欢", a: "提前规划好再开始", b: "保留弹性、到时再定", dim: "JP" },
            { q: "对待截止日期，你更常", a: "尽早完成", b: "临近时再集中冲刺", dim: "JP" },
            { q: "面对选择，你更倾向", a: "尽快定下来并执行", b: "多留几种可能观望", dim: "JP" },
            { q: "工作方式上，你更喜欢", a: "一件事做完再开下一件", b: "几件事交叉推进", dim: "JP" },
            { q: "对规则和流程，你更觉得", a: "有结构更安心", b: "能灵活调整更舒服", dim: "JP" }
        ];

        const typeDescriptions = {
            "INTJ": "建筑师 - 你偏战略思考，喜欢独立推进，追求创新和效率。善于分析复杂问题、制定长期计划。",
            "INTP": "逻辑学家 - 你对理论和抽象概念更有热情，善于发现模式、拆解问题，对重复琐事可能兴趣较低。",
            "ENTJ": "指挥官 - 你偏果断、有目标感，善于组织推进，追求效率与结果，有时会显得强势。",
            "ENTP": "辩论家 - 你好奇、爱挑战既有说法，点子多、反应快，对收尾细节可能耐心不足。",
            "INFJ": "提倡者 - 你重意义与洞察，愿意支持他人成长，理想感强，偶尔会把自己逼得太紧。",
            "INFP": "调停者 - 你重个人价值观与共情，追求和谐与表达，有时会过于敏感或理想化。",
            "ENFJ": "主人公 - 你善于带动他人、关注共同目标，同理心强，也可能过度卷入别人的需求。",
            "ENFP": "竞选者 - 你热情、爱探索新可能，创造力强，专注与纪律有时会跟不上热情。",
            "ISTJ": "物流师 - 你务实、可靠、重条理，擅长按计划执行，灵活性有时不是你的第一选择。",
            "ISFJ": "守护者 - 你细心负责、重视稳定与照顾他人，可能偏保守、不爱轻易打破惯例。",
            "ESTJ": "总经理 - 你组织力强、做事干脆，重视责任与效率，情感层面的细腻沟通可能不是强项。",
            "ESFJ": "执政官 - 你热情负责、善于社交，关心他人与氛围，有时会过于在意别人看法。",
            "ISTP": "鉴赏家 - 你务实、动手能力强，喜欢灵活解决问题，长期规划未必是优先项。",
            "ISFP": "探险家 - 你重感受与美感，活在当下、追求自在，计划性可能偏弱。",
            "ESTP": "企业家 - 你行动快、善于应对现场变化，务实敢试，长期规划有时跟不上节奏。",
            "ESFP": "表演者 - 你热情、爱互动，享受当下氛围，深度沉淀与长期规划可能较少。"
        };

        let currentQuestion = 0;

        function emptyAnswers() {
            return { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        }

        function getSavedAnswer(index) {
            return localStorage.getItem(STORAGE_PREFIX + index);
        }

        function setSavedAnswer(index, option) {
            localStorage.setItem(STORAGE_PREFIX + index, option);
        }

        function clearSavedAnswers() {
            for (let i = 0; i < questions.length; i++) {
                localStorage.removeItem(STORAGE_PREFIX + i);
            }
        }

        function tallyAnswers() {
            const scores = emptyAnswers();
            for (let i = 0; i < questions.length; i++) {
                const saved = getSavedAnswer(i);
                if (!saved) continue;
                const dim = questions[i].dim;
                if (saved === 'A') scores[dim[0]]++;
                else if (saved === 'B') scores[dim[1]]++;
            }
            return scores;
        }

        function pickLetter(left, right, scores) {
            const leftScore = scores[left];
            const rightScore = scores[right];
            const tied = leftScore === rightScore;
            return {
                letter: leftScore >= rightScore ? left : right,
                tied: tied,
                left: left,
                right: right,
                leftScore: leftScore,
                rightScore: rightScore
            };
        }

        function initTest() {
            currentQuestion = 0;
            for (let i = 0; i < questions.length; i++) {
                if (!getSavedAnswer(i)) {
                    currentQuestion = i;
                    break;
                }
                if (i === questions.length - 1) currentQuestion = i;
            }
            renderQuestion();
            updateProgress();
        }

        function renderQuestion() {
            const container = document.getElementById('questions-container');
            const question = questions[currentQuestion];

            container.innerHTML = `
                <div class="question-container active">
                    <div class="question">${question.q}</div>
                    <div class="options">
                        <button type="button" class="option" onclick="selectOption('A')" data-option="A">
                            ${question.a}
                        </button>
                        <button type="button" class="option" onclick="selectOption('B')" data-option="B">
                            ${question.b}
                        </button>
                    </div>
                </div>
            `;

            const savedAnswer = getSavedAnswer(currentQuestion);
            if (savedAnswer) {
                const el = document.querySelector(`[data-option="${savedAnswer}"]`);
                if (el) el.classList.add('selected');
            }

            updateButtons();
        }

        function selectOption(option) {
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.querySelector(`[data-option="${option}"]`).classList.add('selected');
            setSavedAnswer(currentQuestion, option);
            updateButtons();
        }

        function nextQuestion() {
            if (!getSavedAnswer(currentQuestion)) return;
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
                updateProgress();
            } else {
                showResult();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
                updateProgress();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').textContent =
                `问题 ${currentQuestion + 1} / ${questions.length}`;
        }

        function updateButtons() {
            const hasSelection = document.querySelector('.option.selected') !== null;
            document.getElementById('next-btn').disabled = !hasSelection;
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('next-btn').textContent =
                currentQuestion === questions.length - 1 && hasSelection ? '查看结果' : '下一题';
        }

        function renderDimensionBars(dims) {
            const bars = document.getElementById('dimension-bars');
            bars.innerHTML = dims.map(d => {
                const total = d.leftScore + d.rightScore || 1;
                const leftPct = (d.leftScore / total) * 100;
                const tieNote = d.tied ? '<span class="dim-tie-tag">打平</span>' : '';
                return `
                    <div class="dim-row">
                        <div class="dim-labels">
                            <span>${d.left} ${d.leftScore}</span>
                            ${tieNote}
                            <span>${d.rightScore} ${d.right}</span>
                        </div>
                        <div class="dim-track">
                            <div class="dim-fill dim-fill-left" style="width:${leftPct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showResult() {
            const scores = tallyAnswers();
            const dims = [
                pickLetter('E', 'I', scores),
                pickLetter('S', 'N', scores),
                pickLetter('T', 'F', scores),
                pickLetter('J', 'P', scores)
            ];
            const type = dims.map(d => d.letter).join('');
            const ties = dims.filter(d => d.tied);

            document.getElementById('questions-container').style.display = 'none';
            document.querySelector('.btn-container').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            document.querySelector('.progress-text').style.display = 'none';

            document.getElementById('result-type').textContent = type;
            document.getElementById('result-description').textContent =
                typeDescriptions[type] || ('你的MBTI类型是 ' + type);

            renderDimensionBars(dims);

            const tiesEl = document.getElementById('result-ties');
            if (ties.length) {
                tiesEl.textContent = ties.map(d =>
                    `${d.left}/${d.right} 维度打平（各 ${d.leftScore}），字母暂取 ${d.letter}`
                ).join('；') + '。';
            } else {
                tiesEl.textContent = '';
            }

            document.getElementById('result-container').classList.add('show');
        }

        function restartTest() {
            clearSavedAnswers();
            currentQuestion = 0;

            document.getElementById('questions-container').style.display = 'block';
            document.querySelector('.btn-container').style.display = 'flex';
            document.querySelector('.progress-bar').style.display = 'block';
            document.querySelector('.progress-text').style.display = 'block';
            document.getElementById('result-container').classList.remove('show');

            renderQuestion();
            updateProgress();
        }

        initTest();
    </script>
</body>
</html>
