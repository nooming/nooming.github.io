<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFA00">
    <meta name="description" content="本机图片识字：拖入、选择或 Ctrl+V 粘贴。浏览器内 PaddleOCR / Tesseract，识别后自动规整空格与标点，可编辑并预览 Markdown。图不离开浏览器。">
    <meta name="keywords" content="OCR,图片识字,PaddleOCR,Tesseract,本地识别,中文OCR,Markdown">
    <meta name="author" content="nooming">

    <meta property="og:type" content="website">
    <meta property="og:title" content="图片识字">
    <meta property="og:description" content="图不离开浏览器。识别后可编辑并预览 Markdown；首次会下载模型。">

    <title>图片识字</title>

    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/icons/favicon-16x16.png">
    <link rel="manifest" href="../../assets/icons/site.webmanifest">
    <link rel="shortcut icon" href="../../assets/icons/favicon.ico">

    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="assets/css/ocr.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

    <script type="importmap">
    {
        "imports": {
            "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.wasm.min.mjs"
        }
    }
    </script>
</head>
<body class="page-container">
    <div class="page-header">
        <div class="header-top">
            <a href="../../index.html" class="back-btn">返回</a>
        </div>
        <div class="section-header section-header--page">
            <h1>图片识字</h1>
            <p>图不离开浏览器。默认用 PaddleOCR 识别中文与中英印刷体；识别后自动规整空格、标点，可编辑并预览 Markdown。首次会下载约 20MB 模型并缓存。复杂试卷版面不如本机结构识别工具。</p>
        </div>
    </div>

    <main>
        <section class="section">
            <div class="app-panel ocr-toolbar">
                <div class="card-icon-title">
                    <span class="card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" focusable="false"><use href="../../assets/icons/ui/hub-sprite.svg#i-scan-text"/></svg></span>
                    <h2 class="feature-title">识别</h2>
                </div>
                <p class="ocr-field-label" id="ocr-engine-label">引擎</p>
                <div class="ocr-langs ocr-engines" role="radiogroup" aria-labelledby="ocr-engine-label">
                    <label class="ocr-lang"><input type="radio" name="ocr-engine" value="paddle" checked> 标准（PaddleOCR）</label>
                    <label class="ocr-lang"><input type="radio" name="ocr-engine" value="tesseract"> 轻量（Tesseract）</label>
                </div>
                <div id="ocr-langs" class="ocr-langs" role="radiogroup" aria-label="识别语言" hidden>
                    <label class="ocr-lang"><input type="radio" name="ocr-lang" value="chi_sim" checked> 中文</label>
                    <label class="ocr-lang"><input type="radio" name="ocr-lang" value="eng"> 英文</label>
                    <label class="ocr-lang" title="中英混排再用；纯中文截图请选中文"><input type="radio" name="ocr-lang" value="chi_sim+eng"> 中英</label>
                </div>
                <p id="ocr-hint" class="ocr-hint">印刷体/高清截图；手写、模糊、过小的代码截图仍会出错。标准引擎首次下载模型后会缓存。</p>
                <div class="ocr-actions">
                    <label class="tool-btn ocr-file-label">
                        打开图片
                        <input id="ocr-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/tiff,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff" hidden>
                    </label>
                    <button type="button" id="ocr-copy" class="back-btn ocr-action-btn">复制文本</button>
                    <button type="button" id="ocr-clear" class="back-btn ocr-action-btn">清空</button>
                    <p id="ocr-status" class="ocr-status" aria-live="polite">尚未选择图片</p>
                </div>
                <div class="ocr-recent-row" aria-label="最近结果">
                    <label class="ocr-field-inline" for="ocr-recent">
                        <span class="ocr-field-label ocr-field-label--inline">最近结果</span>
                        <select id="ocr-recent" class="ocr-recent-select">
                            <option value="">（无）</option>
                        </select>
                    </label>
                    <button type="button" id="ocr-recent-load" class="back-btn ocr-action-btn" disabled>载入</button>
                </div>
                <div id="ocr-progress" class="ocr-progress" hidden>
                    <div class="ocr-progress-track">
                        <div id="ocr-progress-bar" class="ocr-progress-bar"></div>
                    </div>
                    <p id="ocr-progress-label" class="ocr-progress-label"></p>
                </div>
            </div>

            <div class="ocr-workspace">
                <div id="ocr-drop" class="app-panel ocr-drop" tabindex="0">
                    <p class="ocr-label">图片</p>
                    <img id="ocr-thumb" class="ocr-thumb" alt="待识别图片预览" hidden>
                    <p id="ocr-placeholder" class="ocr-placeholder">拖入图片，或 Ctrl+V。</p>
                </div>
                <div class="app-panel ocr-result-panel">
                    <div class="ocr-result-head">
                        <p class="ocr-label" id="ocr-result-label">识别结果</p>
                        <div class="ocr-tabs" role="tablist" aria-label="结果视图">
                            <button type="button" id="ocr-tab-edit" class="ocr-tab is-active" role="tab" aria-selected="true" aria-controls="ocr-text">编辑</button>
                            <button type="button" id="ocr-tab-preview" class="ocr-tab" role="tab" aria-selected="false" aria-controls="ocr-preview">预览</button>
                        </div>
                    </div>
                    <textarea id="ocr-text" class="ocr-text" spellcheck="false" placeholder="识别出的文字会出现在这里。" aria-labelledby="ocr-result-label"></textarea>
                    <div id="ocr-preview" class="ocr-preview is-empty" role="tabpanel" hidden aria-labelledby="ocr-result-label">
                        <p class="ocr-preview-placeholder">识别完成后可在此预览正文、表格与公式。</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 noomings · 非商业使用</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" defer></script>
    <script src="../../assets/js/utils.js" defer></script>
    <script type="module" src="assets/js/ocr.js"></script>
</body>
</html>
